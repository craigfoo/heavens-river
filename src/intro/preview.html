<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #hud { position: fixed; left: 8px; top: 8px; z-index: 99; font: 11px/1.4 ui-monospace, monospace; color: #fff8; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="hud"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
